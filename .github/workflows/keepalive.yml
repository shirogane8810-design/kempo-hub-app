# Supabase の無料プランは1週間アクセスがないと止まるので、毎日1回アクセスする。
# リポジトリの Settings > Secrets and variables > Actions に
# SUPABASE_URL と SUPABASE_ANON_KEY を登録すると動く（未登録なら何もしない）。
name: Supabase keepalive

on:
  schedule:
    - cron: '17 0 * * *' # 毎日 9:17（日本時間）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Secrets 未設定のためスキップ"; exit 0; fi
          curl -fsS "$SUPABASE_URL/rest/v1/ad_slots?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
          echo ok
